aid: crowdstreet
name: CrowdStreet
description: 'Crowd Street (formerly CrowdStreet) is an online private-markets investing
  platform that gives accredited investors direct access to commercial real estate,
  private equity, venture capital, private credit, and real estate fund offerings.
  Founded in 2013 and headquartered in Austin, Texas, the company operates a marketplace
  where sponsors raise capital and members subscribe to individual deals, diversified
  funds, and managed portfolios, alongside an education center, glossary, and research
  library. Crowd Street Capital LLC is a FINRA-member broker-dealer and Crowd Street
  Advisors LLC is an SEC-registered investment adviser. The platform is delivered as
  a members-only investor web application; as of this profile Crowd Street publishes
  no public developer portal, API documentation, or machine-readable API contract.'
